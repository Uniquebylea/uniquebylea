<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | Unique by Lea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { sand: '#EAE3D9', creme: '#F9F6F2', terracotta: '#B08968', darkbrown: '#4A3728' } } } }
    </script>
</head>
<body class="bg-sand text-darkbrown font-sans">
    <header class="pt-8 text-center border-b border-darkbrown/5 pb-4">
        <nav class="flex justify-center gap-6 md:gap-10 uppercase text-[10px] font-bold">
            <a href="index.html">Startseite</a>
            <a href="shop.html">Shop</a>
            <a href="ueber-mich.html">Über mich</a>
            <a href="kontakt.html" class="text-terracotta">Kontakt</a>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12 md:py-20 grid md:grid-cols-2 gap-12 md:gap-20">
        <!-- Formular -->
        <div class="order-2 md:order-1">
            <h1 class="font-serif text-3xl md:text-4xl mb-8 text-terracotta italic text-center md:text-left">Schreib mir</h1>
            <form action="https://api.web3forms.com/submit" method="POST" class="space-y-4">
                <input type="hidden" name="access_key" value="2b4e9f51-bdd3-4391-9732-39f55bb17727">
                <input type="text" name="name" placeholder="Name" required class="w-full bg-creme rounded-full py-3 px-6 text-sm outline-none border-none shadow-sm">
                <input type="email" name="email" placeholder="E-Mail" required class="w-full bg-creme rounded-full py-3 px-6 text-sm outline-none border-none shadow-sm">
                <textarea name="message" id="msg" rows="5" placeholder="Deine Nachricht" class="w-full bg-creme rounded-2xl py-3 px-6 text-sm outline-none border-none shadow-sm"></textarea>
                <button type="submit" class="w-full bg-terracotta text-white py-4 rounded-full font-bold uppercase text-[11px] tracking-widest shadow-lg hover:bg-darkbrown transition">Nachricht senden</button>
            </form>
        </div>

        <!-- Bild & Infos -->
        <div class="order-1 md:order-2 flex flex-col justify-center">
            <img src="images/uebermich3.jpg" class="rounded-3xl shadow-2xl border-8 border-white/50 object-cover h-64 md:h-96 w-full">
            <div class="mt-8 text-center md:text-left space-y-2 opacity-70 uppercase text-[10px] tracking-widest">
                <p class="font-bold">Lea Limburg</p>
                <p>3800 Interlaken, Schweiz</p>
                <p>uniquebylea@outlook.com</p>
            </div>
        </div>
    </main>

    <script>
        const p = new URLSearchParams(window.location.search).get('produkt');
        if(p) document.getElementById('msg').value = "Hallo Lea, ich interessiere mich für: " + p;
    </script>
</body>
</html>
