backend:
  name: github
  repo: Uniquebylea/uniquebylea
  branch: main
  base_url: https://uniquebylea.vercel.app
  auth_endpoint: api/auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Produkte"
    folder: "content/products"
    create: true
    editor:
      preview: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    summary: "{{name}} - {{price}} ({{cat}})"
    fields:
      - {label: "Produktname", name: "name", widget: "string"}
      - label: "Kategorie"
        name: "cat"
        widget: "select"
        options: ["Baby", "Kinder", "Erwachsene", "Makramee", "Taschen", "Gutscheine", "Accessoires"]
      - {label: "Basispreis (z. B. 79.00 CHF)", name: "price", widget: "string"}
      - {label: "Badge (Optional, z. B. Neu, Unikat, Bestseller)", name: "badge", widget: "string", required: false}
      - {label: "Standard-Bestand (falls keine Optionen mit Bestand)", name: "stock", widget: "number", default: 1, value_type: "int", min: 0, required: false}
      - {label: "Beschreibung", name: "description", widget: "text", required: false}
      - {label: "Hauptbild", name: "img", widget: "image"}

      # Weitere Fotos (Galerie / Detailansichten):
      - label: "Weitere Fotos / Galerie (Mehrfachauswahl möglich)"
        name: "gallery"
        widget: "image"
        multiple: true
        required: false
      
      # Produkt-Optionen wie bei Ionos:
      - label: "Produkt-Optionen (wie bei Ionos: Farbe, Größe, Dropdown, Checkbox)"
        name: "options"
        widget: "list"
        required: false
        collapsed: false
        summary: "{{fields.name}} ({{fields.type}})"
        hint: "Verwenden Sie den Optionstyp, der Ihr Produkt am besten präsentiert: Drop-Down-Listen, damit Kunden aus mehreren Optionen auswählen können, Auswahlknöpfe für eine Einzelauswahl und Kontrollkästchen für die Mehrfachauswahl. Fügen Sie als die gängigsten Anpassungsoptionen Farbe und Größe hinzu."
        fields:
          - label: "Name der Option"
            name: "name"
            widget: "string"
            hint: "Zum Beispiel „Größe“, „Farbe“, „Zusatz“, „Wunschname“ oder „Persönliche Nachricht“"
          - label: "Optionsart"
            name: "type"
            widget: "select"
            default: "dropdown"
            options:
              - { label: "⊟ Drop-Down-Liste", value: "dropdown" }
              - { label: "🎨 Farbe (mit Foto & Bestand)", value: "color" }
              - { label: "🔘 Auswahlknöpfe (Einzelauswahl)", value: "radio" }
              - { label: "📐 Größe (mit Aufpreis)", value: "size" }
              - { label: "☑️ Kontrollkästchen (Zusatz / Mehrfachauswahl)", value: "checkbox" }
              - { label: "✍️ Wunschname / Textfeld", value: "text" }
              - { label: "💌 Persönliche Nachricht (Mehrzeilig)", value: "textarea" }
          - label: "Auswahl erforderlich? (Pflichtfeld)"
            name: "required"
            widget: "boolean"
            default: false
            required: false
            hint: "Muss der Kunde zwingend eine Auswahl treffen?"
          - label: "Optionswerte"
            name: "values"
            widget: "list"
            required: false
            collapsed: false
            summary: "{{fields.title}} (+{{fields.price_add}} CHF)"
            fields:
              - label: "Wert"
                name: "title"
                widget: "string"
                hint: "Zum Beispiel „M“ für die Größe oder „Salbeigrün“"
              - label: "Preisänderung / Aufpreis in CHF"
                name: "price_add"
                widget: "number"
                default: 0
                value_type: "float"
                min: 0
                required: false
                hint: "Optionaler Aufpreis in CHF (z. B. 0 oder 15.00)"
              - label: "Foto für diesen Wert (optional)"
                name: "img"
                widget: "image"
                required: false
              - label: "Lagerbestand für diesen Wert (0 = Ausverkauft)"
                name: "stock"
                widget: "number"
                default: 1
                value_type: "int"
                min: 0
                required: false
