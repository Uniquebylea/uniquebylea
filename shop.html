<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Unique by Lea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { sand: '#EAE3D9', creme: '#F9F6F2', terracotta: '#B08968', darkbrown: '#4A3728' },
                    fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Montserrat', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-sand text-darkbrown font-sans min-h-screen flex flex-col">

    <!-- Header & Navigation -->
    <header class="bg-sand/95 backdrop-blur-md sticky top-0 z-40 border-b border-darkbrown/5 flex flex-col items-center py-4">
        <nav class="flex items-center gap-5 sm:gap-6 uppercase text-[10px] tracking-widest font-bold mb-4">
            <a href="index.html" class="hover:text-terracotta transition">Startseite</a>
            <a href="shop.html" class="text-terracotta border-b border-terracotta">Shop</a>
            <a href="ueber-mich.html" class="hover:text-terracotta transition">Über mich</a>
            <a href="kontakt.html" class="hover:text-terracotta transition">Kontakt</a>
            
            <!-- Instagram Icon -->
            <a href="https://www.instagram.com/uniquebylea" target="_blank" rel="noopener noreferrer" 
               title="Instagram: @uniquebylea" 
               class="text-darkbrown hover:text-terracotta transition flex items-center pl-1 border-l border-darkbrown/15">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
            </a>

            <!-- Warenkorb Button mit Live-Zähler -->
            <button onclick="openCart()" 
                    class="text-darkbrown hover:text-terracotta transition flex items-center gap-1">
                <span>Warenkorb</span>
                <span class="text-terracotta font-bold">(<span id="cartCountBadge">0</span>)</span>
            </button>
        </nav>
        
        <!-- Suchleiste -->
        <div class="w-full max-w-md px-4 mb-3">
            <input type="text" id="searchBar" placeholder="Produkt suchen..." 
                   class="w-full bg-creme border border-darkbrown/10 rounded-full py-2.5 px-6 text-xs outline-none focus:ring-2 focus:ring-terracotta/40 shadow-sm transition">
        </div>
        
        <!-- Kategorie-Filterleiste -->
        <div class="w-full max-w-4xl px-4 overflow-x-auto no-scrollbar flex gap-2 justify-start md:justify-center py-1 text-xs">
            <button onclick="setCategory('')" class="cat-pill px-4 py-1.5 rounded-full uppercase text-[10px] font-bold tracking-wider transition bg-terracotta text-white shadow-sm" data-cat="">Alle</button>
            <button onclick="setCategory('Baby')" class="cat-pill px-4 py-1.5 rounded-full uppercase text-[10px] font-bold tracking-wider transition bg-creme border border-darkbrown/10 hover:border-terracotta text-darkbrown" data-cat="Baby">Baby</button>
            <button onclick="setCategory('Kinder')" class="cat-pill px-4 py-1.5 rounded-full uppercase text-[10px] font-bold tracking-wider transition bg-creme border border-darkbrown/10 hover:border-terracotta text-darkbrown" data-cat="Kinder">Kinder</button>
            <button onclick="setCategory('Erwachsene')" class="cat-pill px-4 py-1.5 rounded-full uppercase text-[10px] font-bold tracking-wider transition bg-creme border border-darkbrown/10 hover:border-terracotta text-darkbrown" data-cat="Erwachsene">Erwachsene</button>
            <button onclick="setCategory('Makramee')" class="cat-pill px-4 py-1.5 rounded-full uppercase text-[10px] font-bold tracking-wider transition bg-creme border border-darkbrown/10 hover:border-terracotta text-darkbrown" data-cat="Makramee">Makramee</button>
            <button onclick="setCategory('Taschen')" class="cat-pill px-4 py-1.5 rounded-full uppercase text-[10px] font-bold tracking-wider transition bg-creme border border-darkbrown/10 hover:border-terracotta text-darkbrown" data-cat="Taschen">Taschen</button>
            <button onclick="setCategory('Accessoires')" class="cat-pill px-4 py-1.5 rounded-full uppercase text-[10px] font-bold tracking-wider transition bg-creme border border-darkbrown/10 hover:border-terracotta text-darkbrown" data-cat="Accessoires">Accessoires</button>
            <button onclick="setCategory('Gutscheine')" class="cat-pill px-4 py-1.5 rounded-full uppercase text-[10px] font-bold tracking-wider transition bg-creme border border-darkbrown/10 hover:border-terracotta text-darkbrown" data-cat="Gutscheine">Gutscheine</button>
        </div>
    </header>

    <!-- Produkt-Raster -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6"></div>
        <div id="noResults" class="hidden text-center py-20 italic text-darkbrown/60">Keine passenden Produkte gefunden...</div>
    </main>

    <!-- SLIDE-OVER WARENKORB (DRAWER VON RECHTS) -->
    <div id="cartModal" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div id="cartBackdrop" onclick="closeCart()" class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity"></div>
        <div class="fixed inset-y-0 right-0 max-w-full flex">
            <div id="cartPanel" class="w-screen max-w-md bg-creme shadow-2xl flex flex-col border-l border-darkbrown/10 transform transition-transform duration-300 translate-x-full">
                
                <!-- Kopfzeile -->
                <div class="p-5 border-b border-darkbrown/10 flex justify-between items-center bg-sand/30">
                    <h2 class="font-serif text-base uppercase tracking-wider font-bold">Dein Warenkorb</h2>
                    <button onclick="closeCart()" class="w-7 h-7 rounded-full bg-darkbrown/5 hover:bg-darkbrown/10 flex items-center justify-center text-darkbrown/70 hover:text-darkbrown transition">✕</button>
                </div>

                <!-- Kostenloser Versand Fortschritt -->
                <div class="bg-creme px-5 py-3 border-b border-darkbrown/5 text-xs">
                    <div id="freeShippingText" class="mb-1.5 font-medium text-darkbrown/80 text-[11px]"></div>
                    <div class="w-full bg-darkbrown/10 rounded-full h-1.5 overflow-hidden">
                        <div id="freeShippingBar" class="bg-terracotta h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Artikelliste -->
                <div id="cartItemsList" class="flex-1 overflow-y-auto p-5 space-y-4"></div>

                <!-- Fußzeile (Versand & Summen) -->
                <div id="cartFooter" class="p-5 border-t border-darkbrown/10 bg-sand/20 space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase font-bold tracking-wider text-darkbrown/70 mb-2">Versandart (Schweiz):</label>
                        <div class="space-y-1.5 text-xs">
                            <label class="flex items-center justify-between p-2.5 rounded-xl border border-darkbrown/10 bg-creme cursor-pointer hover:border-terracotta transition">
                                <span class="flex items-center gap-2">
                                    <input type="radio" name="shipping" value="bpost" checked onchange="updateCartTotals()" class="accent-terracotta">
                                    <span>📦 Schweizer Post (B-Post)</span>
                                </span>
                                <span id="bpostCost" class="font-bold">7.00 CHF</span>
                            </label>
                            <label class="flex items-center justify-between p-2.5 rounded-xl border border-darkbrown/10 bg-creme cursor-pointer hover:border-terracotta transition">
                                <span class="flex items-center gap-2">
                                    <input type="radio" name="shipping" value="apost" onchange="updateCartTotals()" class="accent-terracotta">
                                    <span>⚡ Schweizer Post (A-Post)</span>
                                </span>
                                <span class="font-bold">9.00 CHF</span>
                            </label>
                            <label class="flex items-center justify-between p-2.5 rounded-xl border border-darkbrown/10 bg-creme cursor-pointer hover:border-terracotta transition">
                                <span class="flex items-center gap-2">
                                    <input type="radio" name="shipping" value="pickup" onchange="updateCartTotals()" class="accent-terracotta">
                                    <span>🏠 Abholung im Atelier (Interlaken)</span>
                                </span>
                                <span class="text-terracotta font-bold">Kostenlos</span>
                            </label>
                        </div>
                    </div>

                    <!-- Zwischensumme & Gesamtsumme -->
                    <div class="space-y-1.5 pt-2 border-t border-darkbrown/10 text-xs">
                        <div class="flex justify-between text-darkbrown/70">
                            <span>Zwischensumme:</span>
                            <span id="cartSubtotal" class="font-bold">0.00 CHF</span>
                        </div>
                        <div class="flex justify-between text-darkbrown/70">
                            <span>Versand:</span>
                            <span id="cartShippingCost" class="font-bold">7.00 CHF</span>
                        </div>
                        <div class="flex justify-between text-sm font-bold text-darkbrown pt-1.5 border-t border-darkbrown/5">
                            <span>Gesamtsumme:</span>
                            <span id="cartGrandTotal" class="text-terracotta font-serif text-base font-bold">0.00 CHF</span>
                        </div>
                    </div>

                    <!-- Checkout Buttons -->
                    <div class="space-y-2 pt-2">
                        <button onclick="proceedToOnlineCheckout()" 
                                class="w-full bg-darkbrown hover:bg-terracotta text-white py-3.5 rounded-xl text-xs uppercase tracking-widest font-bold shadow transition flex items-center justify-center gap-2">
                            <span>Zur Kasse (TWINT, Karte, Apple Pay)</span>
                        </button>
                        <button onclick="proceedToPickupCheckout()" 
                                class="w-full border border-darkbrown/20 hover:bg-darkbrown/5 text-darkbrown py-2.5 rounded-xl text-[10px] uppercase tracking-wider font-bold transition">
                            Barzahlung bei Abholung
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Großansicht-Modal (Bildergalerie / Detailansicht) -->
    <div id="galleryModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="closeModal(event)">
        <div class="relative bg-creme rounded-3xl max-w-xl w-full p-6 shadow-2xl border border-white/40 flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-darkbrown/60 hover:text-darkbrown text-xl font-bold w-8 h-8 flex items-center justify-center rounded-full bg-sand/60">✕</button>
            
            <!-- Großes Bild im Modal -->
            <div class="relative w-full aspect-[4/5] bg-white rounded-2xl overflow-hidden mb-4 flex items-center justify-center">
                <img id="modalCurrentImg" src="" alt="Produktfoto" class="w-full h-full object-cover">
                <button id="modalPrevBtn" onclick="changeModalImage(-1)" class="absolute left-2 bg-creme/80 hover:bg-creme text-darkbrown w-9 h-9 rounded-full shadow flex items-center justify-center text-sm font-bold">❮</button>
                <button id="modalNextBtn" onclick="changeModalImage(1)" class="absolute right-2 bg-creme/80 hover:bg-creme text-darkbrown w-9 h-9 rounded-full shadow flex items-center justify-center text-sm font-bold">❯</button>
            </div>

            <!-- Miniatur-Vorschaubilder -->
            <div id="modalThumbs" class="flex gap-2 overflow-x-auto max-w-full pb-2 mb-4 no-scrollbar"></div>

            <h3 id="modalTitle" class="font-serif text-base md:text-lg uppercase tracking-wider text-center mb-1"></h3>
            <p id="modalPrice" class="text-terracotta font-bold text-sm mb-4"></p>
            <button id="modalActionBtn" onclick="addCurrentModalToCart()" class="w-full block text-center bg-darkbrown text-white py-3 rounded-xl text-[10px] uppercase font-bold tracking-widest hover:bg-terracotta transition shadow-md">
                In den Warenkorb
            </button>
        </div>
    </div>

    <!-- JavaScript Logik -->
    <script>
        let allProducts = [];
        let currentCategory = '';
        let activeModalImages = [];
        let currentModalIndex = 0;
        let activeProductIndex = null;

        // Warenkorb im Browser (LocalStorage)
        let cart = JSON.parse(localStorage.getItem('uniquebylea_cart')) || [];

        function parsePrice(str) {
            if (typeof str === 'number') return str;
            if (!str) return 0;
            const cleaned = str.toString().replace(/[^0-9.,]/g, '').replace(',', '.');
            return parseFloat(cleaned) || 0;
        }

        function formatCHF(val) {
            return val.toFixed(2) + " CHF";
        }

        function getProductImages(item) {
            const list = [];
            if (item.img) list.push(item.img);
            if (Array.isArray(item.gallery)) {
                item.gallery.forEach(g => {
                    const src = typeof g === 'string' ? g : (g && g.image ? g.image : null);
                    if (src && !list.includes(src)) list.push(src);
                });
            }
            return list;
        }

        async function load() {
            try {
                const res = await fetch('content/products.json');
                const data = await res.json();
                allProducts = data.produkte || [];

                const urlCat = new URLSearchParams(window.location.search).get('cat');
                setCategory(urlCat || '', false);
                updateCartBadge();
            } catch (e) {
                console.error("Fehler beim Laden der Produkte:", e);
            }
        }

        function setCategory(cat, doRender = true) {
            currentCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = 'cat-pill px-4 py-1.5 rounded-full uppercase text-[10px] font-bold tracking-wider transition bg-terracotta text-white shadow-sm';
                } else {
                    btn.className = 'cat-pill px-4 py-1.5 rounded-full uppercase text-[10px] font-bold tracking-wider transition bg-creme border border-darkbrown/10 hover:border-terracotta text-darkbrown';
                }
            });
            if (doRender) applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchBar').value.trim();
            let filtered = allProducts;

            if (currentCategory) {
                filtered = filtered.filter(p => p.cat === currentCategory);
            }

            if (query) {
                const fuse = new Fuse(filtered, { keys: ['name', 'cat'], threshold: 0.35 });
                filtered = fuse.search(query).map(res => res.item);
            }

            render(filtered);
        }

        function render(list) {
            const grid = document.getElementById('productGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (list.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            list.forEach((item) => {
                const globalIndex = allProducts.indexOf(item);
                const images = getProductImages(item);
                const hasMultiple = images.length > 1;

                grid.innerHTML += `
                <div class="bg-creme p-3.5 md:p-5 rounded-2xl shadow-sm border border-darkbrown/5 flex flex-col justify-between hover:shadow-md transition">
                    <div class="relative cursor-pointer group mb-3 overflow-hidden rounded-xl bg-white aspect-[4/5]" onclick="openModal(${globalIndex})">
                        <img src="${images[0] || 'images/logo.png.jpeg'}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        ${hasMultiple ? `<span class="absolute top-2 right-2 bg-darkbrown/70 text-white text-[9px] px-2 py-0.5 rounded-full backdrop-blur-sm font-semibold">📷 ${images.length}</span>` : ''}
                    </div>
                    <div>
                        <h3 class="font-serif text-[11px] md:text-sm uppercase tracking-wider mb-1 truncate">${item.name}</h3>
                        <p class="text-terracotta font-bold text-xs mb-3">${item.price}</p>
                        <button onclick="addToCart(${globalIndex})" 
                                class="w-full block text-center border border-darkbrown/20 py-2 rounded-lg text-[9px] uppercase font-bold hover:bg-darkbrown hover:text-white transition">
                            In den Warenkorb
                        </button>
                    </div>
                </div>`;
            });
        }

        // ================= WARENKORB LOGIK =================

        function saveCart() {
            localStorage.setItem('uniquebylea_cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            const count = cart.reduce((acc, item) => acc + item.quantity, 0);
            document.getElementById('cartCountBadge').textContent = count;
        }

        window.addToCart = function(productIndex) {
            const prod = allProducts[productIndex];
            if (!prod) return;

            const existingIndex = cart.findIndex(c => c.name === prod.name);
            const priceNum = parsePrice(prod.price);

            if (existingIndex > -1) {
                cart[existingIndex].quantity += 1;
            } else {
                const images = getProductImages(prod);
                cart.push({
                    name: prod.name,
                    price: prod.price,
                    priceNum: priceNum,
                    img: images[0] || 'images/logo.png.jpeg',
                    quantity: 1
                });
            }

            saveCart();
            openCart();
        };

        window.openCart = function() {
            renderCartDrawer();
            const modal = document.getElementById('cartModal');
            const panel = document.getElementById('cartPanel');
            modal.classList.remove('hidden');
            setTimeout(() => {
                panel.classList.remove('translate-x-full');
            }, 10);
        };

        window.closeCart = function() {
            const panel = document.getElementById('cartPanel');
            panel.classList.add('translate-x-full');
            setTimeout(() => {
                document.getElementById('cartModal').classList.add('hidden');
            }, 300);
        };

        function renderCartDrawer() {
            const container = document.getElementById('cartItemsList');
            const footer = document.getElementById('cartFooter');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-center py-16 text-darkbrown/60">
                    <p class="font-serif text-sm mb-2">Dein Warenkorb ist noch leer</p>
                    <p class="text-xs max-w-xs mb-6">Entdecke handgefertigte Einzelstücke und füge deine Lieblingsartikel hinzu.</p>
                    <button onclick="closeCart()" class="border border-darkbrown/20 hover:bg-darkbrown hover:text-white px-6 py-2.5 rounded-full text-xs uppercase font-bold tracking-wider transition">Jetzt stöbern</button>
                </div>`;
                footer.classList.add('hidden');
                document.getElementById('freeShippingText').textContent = "Ab 100.00 CHF kostenloser Versand in der Schweiz!";
                document.getElementById('freeShippingBar').style.width = '0%';
                return;
            }

            footer.classList.remove('hidden');

            cart.forEach((item, idx) => {
                container.innerHTML += `
                <div class="flex items-center gap-3 bg-white p-3 rounded-2xl border border-darkbrown/5 shadow-sm">
                    <img src="${item.img}" alt="${item.name}" class="w-14 h-16 object-cover rounded-xl bg-sand/30 flex-shrink-0">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-serif text-xs font-bold uppercase tracking-wider truncate mb-0.5">${item.name}</h4>
                        <p class="text-terracotta text-xs font-bold mb-2">${formatCHF(item.priceNum)}</p>
                        <div class="flex items-center border border-darkbrown/15 rounded-lg bg-creme w-fit">
                            <button onclick="changeQuantity(${idx}, -1)" class="w-6 h-6 flex items-center justify-center text-xs font-bold text-darkbrown hover:bg-darkbrown/10 rounded-l-lg">-</button>
                            <span class="w-6 text-center text-xs font-bold">${item.quantity}</span>
                            <button onclick="changeQuantity(${idx}, 1)" class="w-6 h-6 flex items-center justify-center text-xs font-bold text-darkbrown hover:bg-darkbrown/10 rounded-r-lg">+</button>
                        </div>
                    </div>
                    <button onclick="removeFromCart(${idx})" class="text-darkbrown/40 hover:text-red-500 p-2 transition text-base">🗑️</button>
                </div>`;
            });

            updateCartTotals();
        }

        window.changeQuantity = function(idx, delta) {
            if (!cart[idx]) return;
            cart[idx].quantity += delta;
            if (cart[idx].quantity <= 0) {
