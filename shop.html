<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Unique by Lea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { sand: '#EAE3D9', creme: '#F9F6F2', terracotta: '#B08968', darkbrown: '#4A3728' } } } }
    </script>
</head>
<body class="bg-sand text-darkbrown font-sans">
    
    <header class="bg-sand sticky top-0 z-50 border-b border-darkbrown/5">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col items-center">
            <nav class="flex gap-4 md:gap-10 uppercase text-[9px] md:text-[10px] font-bold mb-4">
                <a href="index.html">Startseite</a>
                <a href="shop.html" class="text-terracotta">Shop</a>
                <a href="ueber-mich.html">Über mich</a>
                <a href="kontakt.html">Kontakt</a>
            </nav>
            <div class="w-full max-w-md">
                <input type="text" id="searchBar" placeholder="Suchen..." class="w-full bg-creme border border-darkbrown/10 rounded-full py-2 px-6 text-xs outline-none focus:ring-1 focus:ring-terracotta shadow-inner">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Grid: 2 Spalten auf Mobile, 4 auf Desktop -->
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-8"></div>
        <div id="noResults" class="hidden text-center py-20 italic">Keine Produkte gefunden...</div>
    </main>

    <script>
        let allProducts = [];
        async function load() {
            try {
                const res = await fetch('content/products.json');
                const data = await res.json();
                allProducts = data.produkte || [];
                const cat = new URLSearchParams(window.location.search).get('cat');
                render(cat ? allProducts.filter(p => p.cat === cat) : allProducts);
            } catch (e) { console.error(e); }
        }

        function render(list) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if(list.length === 0) document.getElementById('noResults').classList.remove('hidden');
            else {
                document.getElementById('noResults').classList.add('hidden');
                list.forEach(item => {
                    const prod = item.item || item;
                    grid.innerHTML += `
                    <div class="bg-creme p-3 md:p-5 rounded-2xl shadow-sm border border-darkbrown/5 group">
                        <div class="aspect-[4/5] overflow-hidden rounded-xl mb-4 bg-white">
                            <img src="${prod.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        </div>
                        <h3 class="font-serif text-[11px] md:text-sm uppercase tracking-wider mb-1 truncate">${prod.name}</h3>
                        <p class="text-terracotta font-bold text-xs mb-4">${prod.price}</p>
                        <a href="${prod.link || 'kontakt.html?produkt=' + encodeURIComponent(prod.name)}" class="block text-center border border-darkbrown/20 py-2 rounded-lg text-[9px] uppercase font-bold hover:bg-darkbrown hover:text-white transition">Anfragen</a>
                    </div>`;
                });
            }
        }

        const fuse = new Fuse([], { keys: ['name', 'cat'], threshold: 0.4 });
        document.getElementById('searchBar').addEventListener('input', (e) => {
            fuse.setCollection(allProducts);
            render(e.target.value ? fuse.search(e.target.value) : allProducts);
        });
        load();
    </script>
</body>
</html>
